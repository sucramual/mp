name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One job per scripts/check group, so a red check names its cause and one failure does not hide the others.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # setup-uv publishes no floating major tag after v7, so this pins the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/check lint

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/check links

  # The Markdown line limits fail often while skills grow, so their own check names that cause at a glance.
  md-budgets:
    name: md-budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/check md-budgets

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # python3 on PATH matches the local Homebrew Python, which runs the extensionless tools.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
      # check-mermaid.sh needs node 22.22.2+ or 24.15+ (mermaid 12.1.0, jsdom 30.1.3). Its test runs npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Tests run zsh (install_managed_configs) and lsof (git_unlock). Install only what the runner lacks.
      - name: Install zsh and lsof if missing
        run: |
          missing=()
          command -v zsh >/dev/null || missing+=(zsh)
          command -v lsof >/dev/null || missing+=(lsof)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
      # Some tests run the leak check, so this job gets the same secret as the `leaks` job.
      - run: scripts/check tests
        env:
          DOTFILES_LEAK_TERMS: ${{ secrets.DOTFILES_LEAK_TERMS }}
          DOTFILES_LEAK_TERMS_OPTIONAL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '' }}

  leaks:
    name: leaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The leak check reads its private deny list from this secret. A pull request from a Git fork gets no
      # secrets, so the check may pass without terms there. Every other run fails without them.
      # The script uses only the Python standard library, so it runs on the runner's own python3.
      - run: python3 scripts/check_leaks.py
        env:
          DOTFILES_LEAK_TERMS: ${{ secrets.DOTFILES_LEAK_TERMS }}
          DOTFILES_LEAK_TERMS_OPTIONAL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '' }}

  # Branch protection requires a check named `checks`. This job keeps that name and passes only when every
  # group job above passed, so the protection rule needs no change. always() makes it report on a failure too.
  checks:
    name: checks
    needs: [lint, links, md-budgets, tests, leaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "group results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done
